name: Publish customer help center
on:
  push:
    branches: [main]
    paths: ['support-agent/knowledge_docs/**', 'public-help/**', '.github/workflows/help-center.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 public-help/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-help/dist
      - uses: actions/deploy-pages@v4
