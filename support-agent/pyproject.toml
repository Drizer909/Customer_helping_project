[project]
name = "support-agent"
version = "0.1.0"
description = "Intelligent Customer Support Agent with RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.27.0",
    "google-generativeai>=0.8.3",
    "chromadb>=0.5.15",
    "asyncpg>=0.29.0",
    "fastembed>=0.3.0",
    "pydantic-ai>=0.0.9",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
