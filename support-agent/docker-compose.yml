version: '3.8'

services:
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_DB: support_agent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init_db.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/support_agent_db
      CHROMA_PERSIST_DIR: /app/chroma_db
    depends_on:
      - postgres
    volumes:
      - ./knowledge_docs:/app/knowledge_docs
      - ./chroma_db:/app/chroma_db

  dashboard:
    build: ./dashboard
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
