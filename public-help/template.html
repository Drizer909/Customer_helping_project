<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SupportAI Help Center</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f4;color:#173a30;font:1rem/1.6 "Inter",system-ui,sans-serif}header{background:#133e35;color:white;padding:3rem max(5vw,calc((100vw - 68rem)/2))}h1{font-size:clamp(2.5rem,6vw,5rem);line-height:1.08;margin:.5rem 0 2rem}label{display:block;font-weight:600}input{width:min(100%,36rem);padding:.9rem 1rem;font:inherit;border:1px solid #819b90;border-radius:.4rem}main{max-width:72rem;margin:auto;padding:2rem;display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr))}article{background:white;border:1px solid #d3dfd8;border-radius:.7rem;padding:1.5rem 2rem}h2{margin-top:0;font-size:1.65rem}h3{margin-bottom:.25rem}ul,ol{padding-left:1.35rem;margin-top:.25rem}[hidden]{display:none}
</style>
<header><div>SupportAI</div><h1>Help center</h1><label for="search">Search the guides</label><input id="search" type="search" placeholder="Try refunds, shipping or password"></header>
<main><!-- guides --><p id="empty" role="status" hidden>No guides match your search.</p></main>
<script>
const guides = Array.from(document.querySelectorAll('article'));
document.querySelector('#search').addEventListener('input', event => {
  const words = event.target.value.trim().toLowerCase().split(/\s+/);
  for (const guide of guides) {
    guide.hidden = !words.every(word => guide.textContent.toLowerCase().includes(word));
  }
  document.querySelector('#empty').hidden = guides.some(guide => !guide.hidden);
});
</script></html>
